<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1a2035" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Cyan Purple Gradient -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      opacity: 0.4;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dashMove 20s linear infinite;
    }
    @keyframes dashMove {
      to {
        stroke-dashoffset: -320;
      }
    }
    .pulse-glow {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.25; transform: scale(0.98); }
      100% { opacity: 0.55; transform: scale(1.02); }
    }
    .float-card-1 {
      animation: floatCard1 6s ease-in-out infinite alternate;
    }
    @keyframes floatCard1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    .float-card-2 {
      animation: floatCard2 7s ease-in-out infinite alternate;
    }
    @keyframes floatCard2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(8px); }
    }
    .badge-pulse {
      animation: badgePulse 3s ease-in-out infinite;
    }
    @keyframes badgePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glow Blobs in Background -->
  <g class="pulse-glow" style="transform-origin: 300px 170px;">
    <circle cx="200" cy="100" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)"/>
    <circle cx="1050" cy="220" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>
    <circle cx="600" cy="280" r="120" fill="#ec4899" opacity="0.1" filter="url(#glow)"/>
  </g>

  <!-- Subtle Engineering Grid -->
  <g>
    <line x1="0" y1="68" x2="1200" y2="68" class="grid-line" />
    <line x1="0" y1="136" x2="1200" y2="136" class="grid-line" />
    <line x1="0" y1="204" x2="1200" y2="204" class="grid-line" />
    <line x1="0" y1="272" x2="1200" y2="272" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="340" class="grid-line" />
    <line x1="350" y1="0" x2="350" y2="340" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="340" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="340" class="grid-line" />
    <line x1="950" y1="0" x2="950" y2="340" class="grid-line" />
    <line x1="1150" y1="0" x2="1150" y2="340" class="grid-line" />
  </g>

  <!-- Dynamic Connecting Workflow Lines -->
  <path d="M 120 280 C 260 280, 240 230, 420 230" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="flow-line" opacity="0.6" />
  <path d="M 780 230 C 920 230, 950 280, 1100 280" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="flow-line" opacity="0.6" />

  <!-- Animated Mini Kanban / Workflow Cards (Floating in Background Corners) -->
  <g class="float-card-1" filter="url(#cardGlow)">
    <rect x="60" y="42" width="160" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.85"/>
    <rect x="75" y="58" width="60" height="8" rx="4" fill="#3b82f6" />
    <rect x="75" y="74" width="130" height="6" rx="3" fill="#475569" />
    <rect x="75" y="86" width="95" height="6" rx="3" fill="#334155" />
    <circle cx="82" cy="108" r="7" fill="#10b981" />
    <text x="96" y="112" fill="#94a3b8" font-size="10" font-family="sans-serif">Sprint Active</text>
  </g>

  <g class="float-card-2" filter="url(#cardGlow)">
    <rect x="980" y="42" width="160" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.85"/>
    <rect x="995" y="58" width="50" height="8" rx="4" fill="#8b5cf6" />
    <rect x="995" y="74" width="125" height="6" rx="3" fill="#475569" />
    <rect x="995" y="86" width="85" height="6" rx="3" fill="#334155" />
    <circle cx="1002" cy="108" r="7" fill="#06b6d4" />
    <text x="1016" y="112" fill="#94a3b8" font-size="10" font-family="sans-serif">Backlog Groomed</text>
  </g>

  <!-- Central Foreground Content (Guaranteed crisp & always in front) -->
  <g id="foreground-content">
    <!-- Category Tag / Badge -->
    <g transform="translate(600, 56)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95" />
      <circle cx="-118" cy="0" r="4.5" fill="#3b82f6" class="badge-pulse" />
      <text x="8" y="4.5" fill="#60a5fa" font-size="11.5" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1.2">
        ENGINEERING ECOSYSTEM GUIDE
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" class="title-text" fill="#ffffff" font-size="34">
      Awesome Software Development
    </text>
    <text x="600" y="174" text-anchor="middle" class="title-text" fill="url(#accentGrad)" font-size="34">
      Project Tracking
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" text-anchor="middle" class="subtitle-text" fill="#94a3b8" font-size="14.5" letter-spacing="0.3">
      Curated Landscape of Issue Tracking, Agile Sprints, Backlogs &amp; Self-Hosted Engineering Systems
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(600, 268)">
      <!-- Pill 1 -->
      <g transform="translate(-290, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#111827" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="middle" font-family="sans-serif">⚡ Modern Issue Trackers</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-95, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#111827" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="middle" font-family="sans-serif">🏃 Agile &amp; Sprint Cycles</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(100, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#111827" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="middle" font-family="sans-serif">🔓 Self-Hosted Open Source</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(295, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#111827" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" fill="#e2e8f0" font-size="12" font-weight="500" text-anchor="middle" font-family="sans-serif">📊 Enterprise Roadmaps</text>
      </g>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="none" stroke="#334155" stroke-width="1" opacity="0.6"/>
</svg>
